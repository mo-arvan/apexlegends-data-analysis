[project]
name = "apexlegends-data-analysis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "adjusttext>=1.3.0",
    "altair>=6.0.0",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.1.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pyarrow>=23.0.1",
    "requests>=2.33.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "tqdm>=4.67.3",
    "vl-convert-python>=1.9.0.post1",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.11",
]
